<svg xmlns="http://www.w3.org/2000/svg" width="980" height="490" viewBox="0 0 980 490" font-family="Noto Sans CJK SC, sans-serif"><rect width="100%" height="100%" fill="#fbfaf7"/><text x="490" y="42" text-anchor="middle" font-size="24" font-weight="600" fill="#24364b">Run 受理事务：全部成功后才派发</text><rect x="40" y="120" width="190" height="90" rx="14" fill="#e8eff5" stroke="#8298aa" stroke-width="2"/><text x="135" y="151" text-anchor="middle" font-size="18" fill="#24364b" font-weight="600">身份与归属</text><text x="135" y="179" text-anchor="middle" font-size="14" fill="#465569">员工有效 / Session Owner</text><rect x="270" y="120" width="190" height="90" rx="14" fill="#f5e8e1" stroke="#b45e40" stroke-width="2"/><text x="365" y="151" text-anchor="middle" font-size="18" fill="#24364b" font-weight="600">幂等检查</text><text x="365" y="179" text-anchor="middle" font-size="14" fill="#465569">Key + SHA-256</text><rect x="500" y="120" width="190" height="90" rx="14" fill="#f5e8e1" stroke="#b45e40" stroke-width="2"/><text x="595" y="151" text-anchor="middle" font-size="18" fill="#24364b" font-weight="600">容量检查</text><text x="595" y="179" text-anchor="middle" font-size="14" fill="#465569">全局 + 用户级</text><rect x="730" y="120" width="190" height="90" rx="14" fill="#f5e8e1" stroke="#b45e40" stroke-width="2"/><text x="825" y="151" text-anchor="middle" font-size="18" fill="#24364b" font-weight="600">插入 Run</text><text x="825" y="179" text-anchor="middle" font-size="14" fill="#465569">ACCEPTED</text><rect x="730" y="290" width="190" height="90" rx="14" fill="#e8eff5" stroke="#8298aa" stroke-width="2"/><text x="825" y="321" text-anchor="middle" font-size="18" fill="#24364b" font-weight="600">占用 Session</text><text x="825" y="349" text-anchor="middle" font-size="14" fill="#465569">active_run_id IS NULL</text><rect x="500" y="290" width="190" height="90" rx="14" fill="#e8eff5" stroke="#8298aa" stroke-width="2"/><text x="595" y="321" text-anchor="middle" font-size="18" fill="#24364b" font-weight="600">写 USER Message</text><text x="595" y="349" text-anchor="middle" font-size="14" fill="#465569">分配 message_sequence</text><rect x="270" y="290" width="190" height="90" rx="14" fill="#e8f0ec" stroke="#719184" stroke-width="2"/><text x="365" y="321" text-anchor="middle" font-size="18" fill="#24364b" font-weight="600">写 run.accepted</text><text x="365" y="349" text-anchor="middle" font-size="14" fill="#465569">递增 event_count</text><rect x="40" y="290" width="190" height="90" rx="14" fill="#24364b" stroke="#24364b" stroke-width="2"/><text x="135" y="321" text-anchor="middle" font-size="18" fill="#24364b" font-weight="600">COMMIT</text><text x="135" y="349" text-anchor="middle" font-size="14" fill="#465569">提交成功后派发</text><path d="M230 165 L270 165" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M263 157 L270 165 L277 157" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M460 165 L500 165" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M493 157 L500 165 L507 157" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M690 165 L730 165" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M723 157 L730 165 L737 157" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M825 210 L825 290" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M818 282 L825 290 L832 282" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M730 335 L690 335" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M683 327 L690 335 L697 327" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M500 335 L460 335" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M453 327 L460 335 L467 327" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M270 335 L230 335" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M223 327 L230 335 L237 327" stroke="#7d8a98" stroke-width="2" fill="none"/><text x="475" y="440" text-anchor="middle" font-size="15" fill="#465569">任何一步失败：事务回滚。模型调用、工具执行和 SSE 写出都不在数据库事务内。</text></svg>