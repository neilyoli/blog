<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" font-family="Noto Sans CJK SC, sans-serif"><rect width="100%" height="100%" fill="#fbfaf7"/><text x="450" y="42" text-anchor="middle" font-size="24" font-weight="600" fill="#24364b">Snapshot + 排他游标：刷新后只接收未处理事件</text><rect x="50" y="120" width="210" height="105" rx="14" fill="#e8eff5" stroke="#8298aa" stroke-width="2"/><text x="155" y="151" text-anchor="middle" font-size="18" fill="#24364b" font-weight="600">浏览器刷新</text><text x="155" y="179" text-anchor="middle" font-size="14" fill="#465569">重新加载页面</text><rect x="330" y="120" width="210" height="105" rx="14" fill="#f5e8e1" stroke="#b45e40" stroke-width="2"/><text x="435" y="151" text-anchor="middle" font-size="18" fill="#24364b" font-weight="600">GET Snapshot</text><text x="435" y="179" text-anchor="middle" font-size="14" fill="#465569">Message + activeRun + eventCount</text><rect x="610" y="120" width="210" height="105" rx="14" fill="#e8f0ec" stroke="#719184" stroke-width="2"/><text x="715" y="151" text-anchor="middle" font-size="18" fill="#24364b" font-weight="600">恢复消息</text><text x="715" y="179" text-anchor="middle" font-size="14" fill="#465569">显示已保存文本</text><rect x="610" y="300" width="210" height="105" rx="14" fill="#f5e8e1" stroke="#b45e40" stroke-width="2"/><text x="715" y="331" text-anchor="middle" font-size="18" fill="#24364b" font-weight="600">GET SSE</text><text x="715" y="359" text-anchor="middle" font-size="14" fill="#465569">Last-Event-ID = eventCount</text><rect x="330" y="300" width="210" height="105" rx="14" fill="#f5e8e1" stroke="#b45e40" stroke-width="2"/><text x="435" y="331" text-anchor="middle" font-size="18" fill="#24364b" font-weight="600">MySQL Event</text><text x="435" y="359" text-anchor="middle" font-size="14" fill="#465569">sequence > cursor</text><rect x="50" y="300" width="210" height="105" rx="14" fill="#e8f0ec" stroke="#719184" stroke-width="2"/><text x="155" y="331" text-anchor="middle" font-size="18" fill="#24364b" font-weight="600">继续展示</text><text x="155" y="359" text-anchor="middle" font-size="14" fill="#465569">按序应用增量</text><path d="M260 172 L330 172" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M323 164 L330 172 L337 164" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M540 172 L610 172" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M603 164 L610 172 L617 164" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M715 225 L715 300" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M708 292 L715 300 L722 292" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M610 352 L540 352" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M533 344 L540 352 L547 344" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M330 352 L260 352" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M253 344 L260 352 L267 344" stroke="#7d8a98" stroke-width="2" fill="none"/><text x="535" y="465" text-anchor="middle" font-size="15" fill="#465569">Snapshot 和 event_count 来自同一个 REPEATABLE READ 视图，避免快照文本与游标错位。</text></svg>