<svg xmlns="http://www.w3.org/2000/svg" width="920" height="510" viewBox="0 0 920 510" font-family="Noto Sans CJK SC, sans-serif"><rect width="100%" height="100%" fill="#fbfaf7"/><text x="460" y="42" text-anchor="middle" font-size="24" font-weight="600" fill="#24364b">Run 状态机：取消请求不等于执行已经退出</text><rect x="70" y="110" width="190" height="80" rx="14" fill="#e8eff5" stroke="#8298aa" stroke-width="2"/><text x="165" y="141" text-anchor="middle" font-size="18" fill="#24364b" font-weight="600">ACCEPTED</text><text x="165" y="169" text-anchor="middle" font-size="14" fill="#465569">已受理</text><rect x="360" y="110" width="190" height="80" rx="14" fill="#f5e8e1" stroke="#b45e40" stroke-width="2"/><text x="455" y="141" text-anchor="middle" font-size="18" fill="#24364b" font-weight="600">RUNNING</text><text x="455" y="169" text-anchor="middle" font-size="14" fill="#465569">执行中</text><rect x="650" y="110" width="190" height="80" rx="14" fill="#f5e8e1" stroke="#b45e40" stroke-width="2"/><text x="745" y="141" text-anchor="middle" font-size="18" fill="#24364b" font-weight="600">CANCELING</text><text x="745" y="169" text-anchor="middle" font-size="14" fill="#465569">等待退出</text><rect x="70" y="330" width="190" height="80" rx="14" fill="#e8f0ec" stroke="#719184" stroke-width="2"/><text x="165" y="361" text-anchor="middle" font-size="18" fill="#24364b" font-weight="600">CANCELLED</text><text x="165" y="389" text-anchor="middle" font-size="14" fill="#465569">取消终态</text><rect x="360" y="330" width="190" height="80" rx="14" fill="#e8f0ec" stroke="#719184" stroke-width="2"/><text x="455" y="361" text-anchor="middle" font-size="18" fill="#24364b" font-weight="600">SUCCEEDED</text><text x="455" y="389" text-anchor="middle" font-size="14" fill="#465569">成功终态</text><rect x="650" y="330" width="190" height="80" rx="14" fill="#e8f0ec" stroke="#719184" stroke-width="2"/><text x="745" y="361" text-anchor="middle" font-size="18" fill="#24364b" font-weight="600">FAILED / INTERRUPTED</text><text x="745" y="389" text-anchor="middle" font-size="14" fill="#465569">失败或中断</text><path d="M260 150 L360 150" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M353 142 L360 150 L367 142" stroke="#7d8a98" stroke-width="2" fill="none"/><text x="310" y="142" text-anchor="middle" font-size="12" fill="#64748b">领取</text><path d="M550 150 L650 150" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M643 142 L650 150 L657 142" stroke="#7d8a98" stroke-width="2" fill="none"/><text x="600" y="142" text-anchor="middle" font-size="12" fill="#64748b">取消请求</text><path d="M745 190 L745 330" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M738 322 L745 330 L752 322" stroke="#7d8a98" stroke-width="2" fill="none"/><text x="745" y="252" text-anchor="middle" font-size="12" fill="#64748b">执行退出 / 关闭超时</text><path d="M455 190 L455 330" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M448 322 L455 330 L462 322" stroke="#7d8a98" stroke-width="2" fill="none"/><text x="455" y="252" text-anchor="middle" font-size="12" fill="#64748b">成功</text><path d="M165 190 L165 330" stroke="#7d8a98" stroke-width="2" fill="none"/><path d="M158 322 L165 330 L172 322" stroke="#7d8a98" stroke-width="2" fill="none"/><text x="165" y="252" text-anchor="middle" font-size="12" fill="#64748b">领取前取消</text><text x="535" y="465" text-anchor="middle" font-size="15" fill="#465569">只有终态事务成功提交后才释放 Session.active_run_id。</text></svg>